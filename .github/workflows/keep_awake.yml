name: Keep Portfolio Active
on:
  schedule:
    - cron: '0 */4 * * *' # Automatically runs every 4 hours
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Headless Web Automation tools
        run: |
          pip install selenium webdriver-manager
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Visit Portfolio and Wake Up Server
        run: |
          python - <<EOF
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          chrome_options = Options()
          chrome_options.add_argument("--headless")
          chrome_options.add_argument("--no-sandbox")
          chrome_options.add_argument("--disable-dev-shm-usage")
          chrome_options.add_argument("--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")

          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=chrome_options)
          
          print("Opening portfolio site...")
          driver.get("https://streamlit.app")
          time.sleep(10) # Give the system time to trigger the wake routine
          
          print("Interaction complete. App status refreshed.")
          driver.quit()
          EOF
